services:
  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    volumes:
      - ./media:/var/www/media
    ports:
      - 8000:8000
    depends_on:
      - db
    env_file:
      - respa/.env

  db:
    build:
      context: .
      dockerfile: ./docker/postgres/Dockerfile
      # On Apple Silicon (arm64), uncomment below to use native image and avoid slow emulation:
      # platform: linux/arm64
    volumes:
      - db_respa_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: respa
      POSTGRES_PASSWORD: password
      POSTGRES_DB: respa
    env_file:
      - respa/.env

volumes:
  db_respa_data: